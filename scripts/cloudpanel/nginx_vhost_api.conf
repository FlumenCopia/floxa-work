# ==============================================================================
# CLOUDPANEL VHOST CONFIGURATION: Backend API & WebSockets (api-work.flumenx.in)
# In CloudPanel: Go to Sites > api-work.flumenx.in > Vhost > Paste this config
# ==============================================================================

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api-work.flumenx.in work-api.flumenx.in api-floxawork.flumenx.in floxawork-api.flumenx.in api.floxa.work;

  # CloudPanel Managed SSL (Automatic Let's Encrypt certificates)
  {{ssl_certificate_key}}
  {{ssl_certificate}}

  # Root and Logs
  root /home/floxa/htdocs/api-work.flumenx.in;
  access_log /home/floxa/logs/api-work.flumenx.in/access.log;
  error_log /home/floxa/logs/api-work.flumenx.in/error.log;

  # Body Size Limit (Supports up to 50MB file uploads)
  client_max_body_size 55M;

  # Security Headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # REST API Routing -> Node.js Port 5001
  location / {
    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Real-Time WebSocket Upgrades -> Node.js Port 5001 /ws
  location /ws {
    proxy_pass http://127.0.0.1:5001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location ~ /\.ht {
    deny all;
  }
}
