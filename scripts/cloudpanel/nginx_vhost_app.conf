# ==============================================================================
# CLOUDPANEL VHOST CONFIGURATION: Next.js Frontend (floxa.flumenx.in / work.flumenx.in)
# In CloudPanel: Go to Sites > floxa.flumenx.in > Vhost > Paste this config
# ==============================================================================

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name floxa.flumenx.in work.flumenx.in app.floxa.work;

  # CloudPanel Managed SSL (Automatic Let's Encrypt certificates)
  {{ssl_certificate_key}}
  {{ssl_certificate}}

  # Root and Logs
  root /home/floxa/htdocs/floxa.flumenx.in;
  access_log /home/floxa/logs/floxa.flumenx.in/access.log;
  error_log /home/floxa/logs/floxa.flumenx.in/error.log;

  # Body Size Limit
  client_max_body_size 10M;

  # Security Headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Next.js Application Routing -> Localhost Port 3001
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
  }

  location ~ /\.ht {
    deny all;
  }
}
